# -*- sh -*-

#---------------------------
# Enable/disable cron tasks
#---------------------------
#
# Tasks are disabled by default.
# To enable, set state = "on".

# download IMS data
state_ims=off

# download GOES data
state_goes=off

# download GEOS-CF files
state_geoscf=off

# download IERS bulletin A files
state_iers=off

# upload GOES data to ASDC
state_asdc_goes=off

# upload GEOS-CF files to ASDC
state_asdc_geoscf=off

# upload IMS files to ASDC
state_asdc_ims=off

#------------------------------
# Task configuration parameters
#------------------------------

# PDA service account for GOES imagery
pda_service_account="AO_TEMPO_SERV1@140.90.190.143"

# GEOS-CF forecast files
geoscf_source_url="https://portal.nccs.nasa.gov/datashare/gmao/geos-cf/v1/forecast"
#geoscf_source_url="https://ds.nccs.nasa.gov/thredds/fileServer/GMAO/GEOS-CF/forecast"
geoscf_version=1

# IERS bulletin A
iers_source_url="https://datacenter.iers.org/data/latestVersion/6_BULLETIN_A_V2013_016.txt"

# IMS data
ims_url="https://noaadata.apps.nsidc.org/NOAA"
ims_dir="G02156/netcdf/1km"

# ASDC destination
# ASDC LaRC dropbox: (user@host:dir)
#
asdc_dropbox="tempo@xfr140.larc.nasa.gov:ingest/tempo"
asdc_push_method="asdc_push_files.sh"
asdc_pull_method="asdc_pull_ack.sh"
#
# ASDC AWS/S3 bucket: (bucket:bucket_dir)
# Region name and credentials are in $aws_config_file
#
#asdc_dropbox="asdc2-uat-private:tempo-direct"
#asdc_push_method="asdc_push_files_s3.sh"
#asdc_pull_method="asdc_pull_ack_s3.sh"
aws_config_file="$HOME/.ssh/asdc_aws_config_uat";
