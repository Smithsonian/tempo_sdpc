title                 : TEMPO Level 3 total ozone product
collection_shortname  : TEMPO_O3TOT_L3
collection_version    : 1
keywords              : EARTH SCIENCE>ATMOSPHERE>ATMOSPHERIC CHEMISTRY>OXYGEN COMPOUNDS>OZONE

summary: >-
  Total ozone Level 3 files provide ozone information on a regular
  grid covering the TEMPO field of regard for nominal TEMPO
  observations. Level 3 files are derived by combining information
  from all Level 2 files constituting a TEMPO East-West scan cycle.
  The files are provided in netCDF4 format, and contain information on
  total column ozone and some auxiliary derived and ancillary input
  parameters including cloud fraction, cloud pressure, radiative cloud
  fraction, SO2 index, and terrain pressure. The re-gridding algorithm
  uses an area-weighted approach.
