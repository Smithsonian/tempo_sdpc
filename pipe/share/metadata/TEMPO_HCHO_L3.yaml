title                 : TEMPO Level 3 formaldehyde product
collection_shortname  : TEMPO_HCHO_L3
collection_version    : 1
keywords              : EARTH SCIENCE>ATMOSPHERE>AIR QUALITY>VOLATILE ORGANIC COMPOUNDS,
                        EARTH SCIENCE>ATMOSPHERE>ATMOSPHERIC CHEMISTRY>CARBON AND HYDROCARBON COMPOUNDS>FORMALDEHYDE

summary: >-
  Formaldehyde Level 3 files provide trace gas information on a
  regular grid covering the TEMPO field of regard for nominal TEMPO
  observations. Level 3 files are derived by combining information
  from all Level 2 files constituting a TEMPO East-West scan cycle.
  The files are provided in netCDF4 format, and contain information on
  formaldehyde vertical columns, ancillary data used in air mass
  factor calculations and reference sector or de-striping
  corrections, and retrieval quality flags. The re-gridding algorithm
  uses an area-weighted approach.
