title                 : TEMPO Level 1 twilight radiance measurement
collection_shortname  : TEMPO_RADT_L1
collection_version    : 1
keywords              : EARTH SCIENCE>SPECTRAL/ENGINEERING>VISIBLE WAVELENGTHS>VISIBLE RADIANCE, EARTH SCIENCE>SPECTRAL/ENGINEERING>ULTRAVIOLET WAVELENGTHS>ULTRAVIOLET RADIANCE

summary: >-
  Level 1 twilight radiance files provide radiance measured during
  twilight hours to capture city lights at TEMPO’s native spatial
  resolution, ~10 km^2 at the center of the Field of Regard (FOR), for
  individual granules. Each granule covers the entire North-South
  TEMPO FOR but only a portion of the East-West FOR. The files are
  provided in netCDF4 format, and contain information on
  radiometrically calibrated and geolocated radiances for the UV and
  visible bands, corresponding noise, geolocation, viewing geometry,
  quality flags and other ancillary information. The product is
  produced using the L0-1b processor which includes image processing
  steps to produce radiometrically calibrated radiances with nominal
  navigation. Please refer to the ATBD for details.
