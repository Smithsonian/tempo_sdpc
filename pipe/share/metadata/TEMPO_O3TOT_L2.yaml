title                 : TEMPO Level 2 total ozone product
collection_shortname  : TEMPO_O3TOT_L2
collection_version    : 1
keywords              : EARTH SCIENCE>ATMOSPHERE>ATMOSPHERIC CHEMISTRY>OXYGEN COMPOUNDS>OZONE

summary: >-
  Total ozone Level 2 files provide ozone information at TEMPO’s
  native spatial resolution, ~10 km^2 at the center of the Field of
  Regard (FOR), for individual granules. Each granule covers the
  entire North-South TEMPO FOR but only a portion of the East-West
  FOR. The files are provided in netCDF4 format, and contain
  information on total column ozone and some auxiliary derived and
  ancillary input parameters including N-values, effective Lambertian
  scene-reflectivity, UV aerosol index, SO2 index, cloud fraction,
  cloud pressure, ozone below clouds, terrain height, geolocation,
  solar and satellite viewing angles, and quality flags. The retrieval
  is based on the OMI TOMS V8.5 algorithm adapted for TEMPO. For
  further details, please refer to the ATBD.
