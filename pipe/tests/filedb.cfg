nam227:
{
    lookup_table = "${FILEDB_TEST_ROOT_DIR}/ancillary/met/nam227.db" ;
    root_dir = "${FILEDB_TEST_ROOT_DIR}/ancillary/met/nam227" ;
    basename_pattern = "*.grib2" ;
};

nsidc:
{
    lookup_table = "${FILEDB_TEST_ROOT_DIR}/ancillary/snow/nsidc/snow.db" ;
    root_dir = "${FILEDB_TEST_ROOT_DIR}/ancillary/snow/nsidc" ;
    basename_pattern = "NISE_SSMISF*.HDFEOS" ;
};

irr:
{
    lookup_table = "${FILEDB_TEST_ROOT_DIR}/archive/L1/IRR/irr.db" ;
    root_dir = "${FILEDB_TEST_ROOT_DIR}/archive/L1/IRR" ;
    basename_pattern = "TEMPO_IRR_*.nc" ;
};

drk:
{
    lookup_table = "${FILEDB_TEST_ROOT_DIR}/archive/L0/DRK/drk.db" ;
    root_dir = "${FILEDB_TEST_ROOT_DIR}/archive/L0/DRK" ;
    basename_pattern = "TEMPO_DRK_*.nc" ;
};
