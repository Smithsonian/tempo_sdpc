           y0 = [0.05];
     };
   };

   *BLine:
   {
     term = "bl";
     method = "poly"; num_coef = 2; xexp = 640.0;
     function:
     {
         x0 = [640.0];
         y0 = [0.0];
     };
   };

   H2O_285K:
   {
     term = "lbe";
     method = "positive_coeff";
     function:
     {
           nodes = [535.0, 750.0];
           x0 = [640.0];
           y0 = [1.0];
     };
     data:
     {
           value = "H2O_285K_875hPa";
