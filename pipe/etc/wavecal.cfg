           path = "$SDPC_RUN_DIR/refdata/instrument/wavcal_refspec_TEMPO_ILS_Band2.nc";
           scale_factor = 1.0e24;
     };
   };

   O2_285K:
   {
     term = "lbe";
     method = "positive_coeff";
     function:
     {
           nodes = [535.0, 750.0];
           x0 = [640.0];
           y0 = [1.0];
     };
     data:
     {
           value = "O2_285K_875hPa";
           wavegrid = "Wavelength";
           path = "$SDPC_RUN_DIR/refdata/instrument/wavcal_refspec_TEMPO_ILS_Band2.nc";
           scale_factor = 1.0e24;
     };
   };
  };
};  # end of band_540_740_nm
