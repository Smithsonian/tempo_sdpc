   {
      name = "CLDRR";
      metadata: {
          shortname = "TEMPO_CLDRR_L3";
          template_file = "$SDPC_ROOT/etc/level3/simple.met.template";
      };
      filename_list = "TEMPO_CLDRR_L2.lis";
      longlat_group = {in = "geolocation"; out = "/";};
      vars = (
          {in="product/cloud_pressure"; qa="cloud_pressure"},
          {in="product/cloud_fraction"; qa="cloud_fraction"},
          {in="geolocation/solar_zenith_angle";},
          {in="geolocation/viewing_zenith_angle";},
          {in="geolocation/relative_azimuth_angle";},
          {in="geolocation/terrain_height";},
          {in="support_data/chlorophyll";},
          {in="support_data/terrain_pressure";},
          {in="support_data/radiative_cloud_fraction";},
          {in="support_data/surface_reflectivity";},
          {in="support_data/reflectivity";},
          {in="support_data/filling_in_factor";},
          {in="support_data/dIdR";}
      );
   };

