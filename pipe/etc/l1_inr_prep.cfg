#
# Parameters controlling the generation of
# telemetry-only radiance files:
#
telemetry_only_config: {
  target_dir = "$PROCESSING_ROOT/inr/Staging/Granules";
  processing_version = 1;
};

smc_config: {
  file_glob = "$SDPC_RUN_DIR/L0/incoming/telem/TEMPO_smc_L0_*.nc";
  num_pad = 10;
};

iru_config: {
  file_glob = "$SDPC_RUN_DIR/L0/incoming/telem/TEMPO_iru_L0_*.nc";
  num_pad = 10;
};

ephemeris_config: {
  file = "$SDPC_RUN_DIR/ancillary/ephem/eph_synth.csv";
  num_pad = 10;
};
