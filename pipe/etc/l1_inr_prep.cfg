#
# Parameters controlling the generation of
# telemetry-only radiance files:
#
telemetry_only_config: {
  target_dir = "$SDPC_RUN_DIR/inr/Staging/Granules";
};

# typical data rate is 100 Hz, so 500 samples is 5 sec of padding
smc_config: {
  file_glob = "$SDPC_ARCHIVE_DIR/L0/1/%d/SMC/TEMPO_SMC_L0_*.nc";
  num_pad = 500;
};

# typical data rate is 100 Hz, so 500 samples is 5 sec of padding
iru_config: {
  file_glob = "$SDPC_ARCHIVE_DIR/L0/1/%d/IRU/TEMPO_IRU_L0_*.nc";
  num_pad = 500;
};

ephemeris_config: {
  num_pad = 10;
};
