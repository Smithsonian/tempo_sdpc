met:
{
    root_dir = "$SDPC_RUN_DIR/ancillary/met" ;
    basename_pattern = "20*.nc" ;
    lookup_table = "/tmp/sdpc_test/met.db" ;
};

snow:
{
    root_dir = "$SDPC_RUN_DIR/ancillary/snow" ;
    basename_pattern = "NISE_SSMISF*.HDFEOS" ;
    lookup_table = "/tmp/sdpc_test/nsidc.db" ;
};

irr:
{
    root_dir = "$SDPC_RUN_DIR/archive/L1/1/irr" ;
    basename_pattern = "TEMPO_irr_*.nc" ;
    lookup_table = "/tmp/sdpc_test/irr.db" ;
};

drk:
{
    root_dir = "$SDPC_RUN_DIR/archive/L0/1/drk" ;
    basename_pattern = "TEMPO_drkt_*.nc" ;
    lookup_table = "/tmp/sdpc_test/drk.db" ;
};
