synth:
{
    root_dir = "$SDPC_RUN_DIR_MASTER/ancillary/met" ;
    basename_pattern = "20*.nc" ;
    lookup_table = "/var/tmp/$USER/$SDPC_PIPE_NAME/met_synth.db" ;
};

hires:
{
    root_dir = "$SDPC_RUN_DIR_MASTER/ancillary/met" ;
    basename_pattern = "20*conusnest*.grib2" ;
    lookup_table = "/var/tmp/$USER/$SDPC_PIPE_NAME/met_hires.db" ;
};

lores:
{
    root_dir = "$SDPC_RUN_DIR_MASTER/ancillary/met" ;
    basename_pattern = "20*awip32*.grib2" ;
    lookup_table = "/var/tmp/$USER/$SDPC_PIPE_NAME/met_lores.db" ;
};

snow:
{
    root_dir = "$SDPC_RUN_DIR_MASTER/ancillary/snow" ;
    basename_pattern = "NISE_SSMISF*.HDFEOS" ;
    lookup_table = "/var/tmp/$USER/$SDPC_PIPE_NAME/nsidc.db" ;
};

irr:
{
    root_dir = "$SDPC_ARCHIVE_DIR/L1/IRR" ;
    basename_pattern = "TEMPO_IRR_L1_V??_20*Z.nc" ;
    lookup_table = "/var/tmp/$USER/$SDPC_PIPE_NAME/irr.db" ;
};

drk:
{
    root_dir = "$SDPC_ARCHIVE_DIR/L1/DRK" ;
    basename_pattern = "TEMPO_DRK_L1_V??_20*Z.nc" ;
    lookup_table = "/var/tmp/$USER/$SDPC_PIPE_NAME/drk.db" ;
};

ephemeris:
{
    root_dir = "$SDPC_ANCILLARY_ROOT/ephem" ;
    basename_pattern = "tempo_*_pred.eph" ;
    lookup_table = "/var/tmp/$USER/$SDPC_PIPE_NAME/ephem.db" ;
};
