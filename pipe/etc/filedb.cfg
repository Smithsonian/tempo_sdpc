met:
{
    root_dir = "$SDPC_RUN_DIR_MASTER/ancillary/met" ;
    basename_pattern = "20*.nc" ;
    lookup_table = "/var/tmp/$USER/$SDPC_PIPE_NAME/met.db" ;
};

snow:
{
    root_dir = "$SDPC_RUN_DIR_MASTER/ancillary/snow" ;
    basename_pattern = "NISE_SSMISF*.HDFEOS" ;
    lookup_table = "/var/tmp/$USER/$SDPC_PIPE_NAME/nsidc.db" ;
};

irr:
{
    root_dir = "$SDPC_ARCHIVE_DIR/L1/1/irr" ;
    basename_pattern = "TEMPO_irr_*.nc" ;
    lookup_table = "/var/tmp/$USER/$SDPC_PIPE_NAME/irr.db" ;
};

drk:
{
    root_dir = "$SDPC_ARCHIVE_DIR/L0/1/drk" ;
    basename_pattern = "TEMPO_drkt_*.nc" ;
    lookup_table = "/var/tmp/$USER/$SDPC_PIPE_NAME/drk.db" ;
};
