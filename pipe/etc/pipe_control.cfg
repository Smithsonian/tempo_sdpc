# -*- sh -*-

product: {
  processing_version = 2;
  # Version number for output data products
};

# IOC interface:
ioc: {
   livestream_dir = "/tempo/ioc/sciroot/l0spool";
   # Directory where IOC delivers TEMPO science data

   socarchive_dir = "/tempo/ioc/cacheroot/socarchive";
   # Directory where IOC delivers raw telemetry and
   # spacecraft ancillary data
};

# ASDC interface:
asdc: {
   dropbox = "tempo@xfr140.larc.nasa.gov:ingest/tempo";
   #dropbox = "jhouck@waps.cfa.harvard.edu:ingest/tempo";

   update_interval = 300;
   # [seconds] time interval between ASDC updates

   max_num_files = 10;
   # Per-table limit on the number of results from database query
   # which, in turn, limits the number of files uploaded at once.
   # (max_num_files <=0 means no limit)
};

dbfile: {
   level0 = "";
   # Sqlite file path to be used for Level 0 IRU, SMC, HK file lookup
   # in 'repro0' context.
   # When not set to a valid file path, the default path
   # is $SDPC_ARCHIVE_DBFILE

   level1 = "";
   # Sqlite file path to be used for Level 1 IRR file lookup
   # in 'repro1' context.
   # When not set to a valid file path, the default path
   # is $SDPC_ARCHIVE_DBFILE
};

level1a: {
   wait_iru_sec = 480;
   # Potential wait time for IRU/SMC data to cover radiance granule.
   # For synthetic data testing, use 0 sec.
   # For operations, wait time governed by IOC latency

   wait_hk_sec = 480;
   # Potential wait time for HK data to cover dark/irr/rad granule.

   nominal_rad_wavegrid_from_irr = true;
   #  true: get radiance nominal_wavelengths from a recent IRR_L1 file
   # false: get radiance nominal_wavelengths from calbration file

   diagnostic_index = "OFF";
   # To enable this diagnostic feature, set it to an integer,
   # 0 <= n <= num_frames_in_granule
   # To disable this feature, set it to the string, "OFF".
};

level1b: {
   wavecal = true;
   # Radiance wavelength calibration enable
   wavecal_ntasks = 2;
   # Number of parallel radiance wavelength calibration tasks per band

   polcorr = true;
   # Radiance polarization correction enable

   postinr = true;
   # Radiance post-INR processing

   diagnostic_index = "OFF";
   # To enable this diagnostic feature, set it to an integer,
   # 0 <= n <= num_frames_in_granule
   # To disable this feature, set it to the string, "OFF".

   irr_select_window = 21;
   # Retrievals use most recent irradiance measurement within this interval [days]
};

level2: {
   products = "HCHO,NO2,O3TOT,O3PROF";
   # Level 2 products to generate (comma-delimited string, no spaces).

   o3prof_mode = "UVVIS";
   # Ozone profile algorithm mode:  UV | UVVIS

   o3prof_time_limit = "240";
   # O3PROF block time limit (srun --time option)
};

# To use or generate radiance reference files:
#     Set radref.enable=true
# To enable searching for a previously generated radref:
#     Set radref.search=true
# If search is disabled, generation of the affected products will be
# delayed until a radiance reference is generated for the current scan.
# To generate data products using the radiance reference:
#    1) Ensure that the product is listed in 'radref.products'
#    2) Ensure that the relevant PGE control file(s) have radref enabled.

radref: {
  enable = true;
  search = false;
  products = "HCHO";
  cron_trigger_level2 = false;
  # In repro context, use cron_trigger_level2=true
  # In live context, use cron_trigger_level2=false
};

# To use or generate HCHO destriping/background correction files:
#     Set destripe.HCHO.enable=true
# To enable searching for a previously generated HCHO destriping file:
#     Set destripe.HCHO.search=true
# To apply the HCHO destriping/background correction,
#    1) Set destripe.HCHO.enable=true
#    2) Set destripe.HCHO.apply=true
# If search is disabled, generation of the affected products will be
# delayed until a destriping correction file is generated for the current
# scan.
# NOTE: If the destriping configuration is changed while the pipeline
#       is running, notify the 'register' service by sending it a SIGHUP
#       signal.  This will ensure that ASDC uploads are deferred (or not),
#       as needed.

destripe: {
  HCHO: {
    enable = true;
    apply  = true;
    search = false;
  };
};
