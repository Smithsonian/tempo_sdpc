# -*- sh -*-

product: {
  processing_version = 4;
  # Version number for output data products
};

# IOC interface:
ioc: {
   livestream_dir = "/tempo/ioc/sciroot/l0spool";
   # Directory where IOC delivers TEMPO science data

   socarchive_dir = "/tempo/ioc/cacheroot/socarchive";
   # Directory where IOC delivers raw telemetry and
   # spacecraft ancillary data
};

# ASDC interface:
asdc: {
   # ASDC production dropbox: (user@host:dir)
   dropbox = "tempo@xfr140.larc.nasa.gov:ingest/tempo";
   # ASDC test dropbox:
   #dropbox = "tempo@xfr140.larc.nasa.gov:/XSan/DH/Incoming/tempo/ingest/tempo"
   # SAO-local url for upload testing:
   #dropbox = "jhouck@waps.cfa.harvard.edu:ingest/tempo";

   update_interval = 300;
   # [seconds] time interval between ASDC updates

   max_num_files = 30;
   # Per-table limit on the number of results from database query
   # which, in turn, limits the number of files uploaded at once.
   # (max_num_files <=0 means no limit)

   upload_baseline_to_s3 = true;
   # Upload baseline products to ASDC S3 bucket

   #bucket = "asdc-prod-private:tempo-direct";
   #aws_config_file = "$HOME/.ssh/asdc_aws_config_prod";
   bucket = "asdc2-uat-private:tempo-direct";
   aws_config_file = "$HOME/.ssh/asdc_aws_config_uat";
   # ASDC S3 bucket: (bucket:bucket_dir)
   # Region name and credentials are in the config file specified by
   # the AWS_CONFIG_FILE environment variable.
   #   asdc_aws_config_prod (for production)
   #   asdc_aws_config_uat  (for testing)

   update_interval_s3 = 300;
   # [seconds] time interval between ASDC S3 updates

   max_num_files_s3 = 30;
   # Per-table limit on the number of results from database query
   # which, in turn, limits the number of files uploaded at once.
   # (max_num_files <=0 means no limit)
};

dbfile: {
   level0 = "";
   # Sqlite file path to be used for Level 0 IRU, SMC, HK file lookup
   # in 'repro0' context.
   # When not set to a valid file path, the default path
   # is $SDPC_ARCHIVE_DBFILE

   level1 = "";
   # Sqlite file path to be used for Level 1 IRR file lookup
   # in 'repro1' context.
   # When not set to a valid file path, the default path
   # is $SDPC_ARCHIVE_DBFILE
};

level1a: {
   wait_iru_sec = 480;
   # Potential wait time for IRU/SMC data to cover radiance granule.
   # For synthetic data testing, use 0 sec.
   # For operations, wait time governed by IOC latency

   wait_hk_sec = 480;
   # Potential wait time for HK data to cover dark/irr/rad granule.

   nominal_rad_wavegrid_from_irr = true;
   #  true: get radiance nominal_wavelengths from a recent IRR_L1 file
   # false: get radiance nominal_wavelengths from calbration file

   diagnostic_index = "OFF";
   # To enable this diagnostic feature, set it to an integer,
   # 0 <= n <= num_frames_in_granule
   # To disable this feature, set it to the string, "OFF".

   solcal_cache_enable = true;
   # Enable/disable caching of solar wavelength calibration parameters

   solcal_cache_products = "O2O2,HCHO,NO2";
   # Cache solar wavelength calibration parameters for these trace gas products.
   # Must be a comma-delimited string with no spaces.

   radt_enable = false;
   # Enable/disable L0-1 processing of RADT data
};

level1b: {
   wavecal = true;
   # Radiance wavelength calibration enable
   wavecal_ntasks = 2;
   # Number of parallel radiance wavelength calibration tasks per band

   polcorr = false;
   # Radiance polarization correction enable

   postinr = true;
   # Radiance post-INR processing enable

   postinr_only = false;
   # Setting postinr_only=true disables all pipeline processing
   # following completion of the Level 1b radiance file.
   # Use this *only* when Level 2 products aren't needed.

   diagnostic_index = "OFF";
   # To enable this diagnostic feature, set it to an integer,
   # 0 <= n <= num_frames_in_granule
   # To disable this feature, set it to the string, "OFF".

   irr_select_window = 21;
   # Retrievals use most recent irradiance measurement within this interval [days]

   inr_qa_enable = false;
   # Enable/disable daily INR quality assessment.
};

level2: {
   products = "HCHO,NO2,O3TOT,O3PROF";
   # Level 2 products to generate (comma-delimited string, no spaces).

   defer_on_register = "NO2_L2,RADT_L1";
   # Level 2 products to be labeled asdc_status=defer upon initial
   # registration in the archive.  This status will be changed to
   # asdc_status=new only after one or more post-processing stages
   # are completed.

   destripe_tg = "NO2_L2";
   # Level 2 TG products needing destriping correction
   # (comma-delimited string, no spaces, symbols need _L2 suffix)

   bkgcorr_tg = "HCHO_L2";
   # Level 2 TG products needing background correction
   # (comma-delimited string, no spaces, symbols need _L2 suffix)

   o3prof_mode = "UV";
   # Ozone profile algorithm mode: UV | UVVIS

   o3prof_time_limit = "240";
   # O3PROF block time limit (srun --time option)
};

# To use or generate radiance reference files:
#     Set radref.enable=true
# To enable searching for a previously generated radref:
#     Set radref.search=true
# If search is disabled, generation of the affected products will be
# delayed until a radiance reference is generated for the current scan.
# To generate data products using the radiance reference:
#    1) Ensure that the product is listed in 'radref.products'
#    2) Ensure that the relevant PGE control file(s) have radref enabled.

radref: {
  enable = true;
  search = false;
  products = "HCHO";
  cron_trigger_level2 = false;
  # In repro context, use cron_trigger_level2=true
  # In live context, use cron_trigger_level2=false
};

daily: {
   make_destripe_tg = "NO2";
   # Archive a destriping file for these TG products
   # (comma-delimited string, no spaces)
};

# Control parameters specific to the near-real-time (NRT) pipeline services.
nrt: {
  # To disable NRT product generation, do:
  #    touch $SDPC_PIPE_DIR/ctrl/disable-nrt
  # To enable NRT product generation, make sure that file does not exist.

  partition = "part1";
  # Slurm partition to use for generating NRT products

  radref_dbfile = "";
  # Sqlite database file to be used when selecting a radiance reference file.
  # Default: $SDPC_ARCHIVE_DBFILE

  products = "HCHO,NO2";
  # Level 2 products to generate (in addition to CLDO4).
  # Must be a comma-delimited string with no spaces.

  processing_version = 2;
  # Version number for output NRT data products

  solcal_cache_enable = true;
  # Enable/disable using cached solar wavelength calibration parameters
  # in trace gas retrievals.

  num_archive_days = 14;
  # Number days of NRT data products to keep in the archive
};
