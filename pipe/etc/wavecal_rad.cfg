wavecal_control:
{
   xtol = 1.e-8;    # parameter convergence criterion
   ftol = 1.e-8;    # objective function convergence criterion
#  maxiter = 200;   # max number of Levenberg-Marquardt iterations
   maxiter = 100;   # change from 200 to 100

   sza_max = 90.0;  # Radiance spectra with sza > sza_max will not be calibrated

   #shift_adjust_table = "$SDPC_REFDATA_DIR/instrument/wavecal_adjust_20190727.nc";
   #shift_adjust_table = "$SDPC_REFDATA_DIR/instrument/wavecal_adjust_20210215.nc";
   shift_adjust_table = "$SDPC_REFDATA_DIR/instrument/wavecal_adjust_20220126.nc";
};

band_290_490_nm:
{
  # small window in 320~340nm
  feature_window:
  {
     start_pix        = 144;
     num_pix_fit      = 100;
     fid_wavelength   = 0.0;
     delta_wavelength = 0.198;    # bin width [nm]
  };
  
#  sampling:
#  {
#     interval   = 10;
#     half_width = 0;
#    isrf_pad_frac = 0.15;
#  }

  wavecal_irradiance:
  {
    # Wavelength grid parameterization:
    method = "cheb"; num_coef = 1;
    adjust_nominal_wavelength = true;

    # Reference solar spectrum for wavelength calibration:
    data:
    {
       value = "SolarIrradiance";
       wavegrid = "Wavelength";
       path = "$SDPC_REFDATA_DIR/instrument/wavcal_refspec_TEMPO_ILS_reformat_V2.nc";
       scale_factor = 1.0e-14;
    };
  };

  wavecal_radiance:
  {
  model_components:{
   # The radiance model has the form:
   #  model = sc*(i0 + ad1)*exp(-lbe) + bl + ad2
   #
   # Each component listed here contributes to a single
   # term which must be one of: {sc, ad1, ad2, lbe, bl}.
   #
   # To omit a component from the fit, prefix the
   # corresponding section label with an asterisk (*).

   AlbSC:
   {
     term = "sc";
     method = "poly"; num_coef = 3; xexp = 390.0;
     scale_by_mean_radiance_over_mean_irradiance = true;
     function:
     {
           x0 = [395.0];
           y0 = [0.97];
     };
   };

   BLine:
   {
     term = "bl";
     method = "poly"; num_coef = 1; xexp = 390.0;
     function:
     {
         x0 = [390.0];
         y0 = [0.0];
     };
   };

   RING:
   {
     term = "ad1";
     method = "poly"; num_coef = 1; xexp = 390.0;
     function:
     {
           x0 = [395.0];
           y0 = [0.03];
     };
     data:
     {
           value = "RING";
           wavegrid = "Wavelength";
           path = "$SDPC_REFDATA_DIR/instrument/wavcal_refspec_TEMPO_ILS_reformat_V2.nc";
     };
   };

   O3_220K:
   {
     term = "lbe";
     method = "poly"; num_coef = 1; xexp = 390.0 
     function:
     {
           x0 = [390.0];
           y0 = [0.0];
     };
     data:
     {
           value = "O3_220K";
           wavegrid = "Wavelength";
           path = "$SDPC_REFDATA_DIR/instrument/wavcal_refspec_TEMPO_ILS_reformat_V2.nc";
           scale_factor = 1.0e22;
     };
   };

   O4_293K:
   {
     term = "lbe";
     method = "poly"; num_coef = 1; xexp = 390.0 
     function:
     {
           x0 = [390.0];
           y0 = [0.0];
     };
     data:
     {
           value = "O4_293K";
           wavegrid = "Wavelength";
           path = "$SDPC_REFDATA_DIR/instrument/wavcal_refspec_TEMPO_ILS_reformat_V2.nc";
           scale_factor = 1.0e48;
     };
   };

  }; # end of model_components
  }; # end of wavecal_radiance
};   # end of band_290_490_nm

