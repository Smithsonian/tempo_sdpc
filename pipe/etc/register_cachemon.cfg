% Incoming directory and filename pattern to watch for:
_P.incoming_dir  = "${SDPC_ARCHIVE_DIR}/registry/incoming"$;
_P.file_glob     = "TEMPO*.nc";
_P.order         = "oldest";
_P.wait_sec      = 10.0;

% Parameters controlling how the executable is run:
% Note that exec_root_dir is a directory on the current machine;
% use exec_root_dir=NULL if the executable will initiate processing
% on a remote host (e.g. via slurm).
_P.exec_root_dir = NULL;
_P.exec_logfile  = "${SDPC_RUN_DIR_MASTER}/log/register_cachemon_exec.log"$;

% Executable to run:
_P.exec_name     = "archive_register.sh";
