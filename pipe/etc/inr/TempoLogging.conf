--default
* GLOBAL:
   FORMAT               =  "%datetime %level %msg"
   FILENAME             =  "/home/houck/sdpc_test/inr/logs/master-%datetime{%Y%M%d}.log"
   ENABLED              =  true
   TO_FILE              =  true
   TO_STANDARD_OUTPUT   =  true
   MILLISECONDS_WIDTH   =  6
   PERFORMANCE_TRACKING =  true

* TRACE:
   ENABLED              =  true
*INFO:
   ENABLED              =  true
* DEBUG:
    ENABLED             =  true
* WARNING:
    ENABLED             =  true
*ERROR:
    ENABLED             =  true
*FATAL:
   ENABLED              =  true

--store
