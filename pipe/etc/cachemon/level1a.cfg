% Incoming directory and filename pattern to watch for:
_P.incoming_dir  = "${SDPC_RUN_DIR_MASTER}/stage/level0/ccd"$;
_P.file_glob     = "*.nc";
_P.order         = "oldest_utc_timestamp";
_P.wait_sec      = 10.0;
_P.wait_arg      = NULL;   % Wait for the child process to exit

% Rely on the cluster workload manager to balance the load
_P.use_cpu_limiter = 0;

% Parameters controlling how the executable is run:
% Note that exec_root_dir is a directory on the current machine;
% use exec_root_dir=NULL if the executable will initiate processing
% on a remote host (e.g. via slurm).
_P.exec_root_dir = NULL;

% Executable to run:
_P.exec_name     = "level1a.sh";
