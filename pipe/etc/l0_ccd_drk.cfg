enable:
{
   badpix_use   = true;
   btdf         = true;
   diff_polcorr = false;
   crosstalk    = true;
   hotcold      = true;
   nonlinearity = true;
   prnu         = true;
   transients   = false;

   dark         = "mean_sdc_adj";
                  # dark: none | mean | mean_tfpa_adj | mean_sdc_adj

   smear        = "timing";
                  # smear: none | oclocks | timing

   straylight   = "none";
                  # straylight: none | psf | bb_kernel | shadow
};

btdf:
{
   do_scat_ang_corr = true;  # Scattering angle correction
   do_extra_corr = true;     # Minor correction for elevation-angle dependence of BTDF
   lab_scaling_factor = 0.8; # scaling factor for lab-derived scattering-angle dependence of BTDF
};

straylight:
{
   shadow_method:
   { 
       which_shadows = "NS"; # [N|T][S|B]  N=north/T=top S=south/B=bottom
       num_col_top = 3;      # number of top shadow columns used for correction
       num_col_bot = 5;      # number of bottom shadow columns used for correction
   };

   psf_method:
   {
       use_shadows = false;
       scale_factor_vis_to_uv = 0.0;
   };
};

calibration:
{
   cal_param_file = "$SDPC_REFDATA_DIR/instrument/TEMPO_senscal_batc_deliverable_04102024_v6.0.nc";
   gain_file      = "$SDPC_REFDATA_DIR/instrument/TEMPO_senscal_batc_deliverable_04102024_v6.0.nc";
   badpix_file    = "$SDPC_REFDATA_DIR/instrument/TEMPO_senscal_batc_deliverable_04102024_v6.0.nc";
   sensorcal_file = "$SDPC_REFDATA_DIR/instrument/TEMPO_senscal_batc_deliverable_04102024_v6.0.nc";

   # instrument linear polarization sensitivity:
   lps_file       = "$SDPC_REFDATA_DIR/polarization/TEMPO_lps_table_V2_reordered.nc";

   straylight:
   {
     bb_kernel = "$SDPC_REFDATA_DIR/instrument/TEMPO_senscal_batc_deliverable_04102024_v6.0.nc";
     psf       = "$SDPC_REFDATA_DIR/instrument/TEMPO_senscal_batc_deliverable_04102024_v6.0.nc";
   };

   trend_rcoef = "$SDPC_REFDATA_DIR/instrument/tempo_trend_example.nc";
   trend_btdf  = "$SDPC_REFDATA_DIR/instrument/tempo_trend_example.nc";

   sdc_row_offset = 0;   # Location of storage region dark current sums.
                         # 0 means SDC row is 1st row above the storage region
                         # non-zero means SDC row is 2nd row above the storage region

   offset_rowbyrow     = true; # true - row-by-row offset | false - constant offset
   # BELOW ARE FOR ROW-BY-ROW OPTION ONLY
   offset_num_skip     = 6;    # number of trailing columns excluded
   offset_num_selected = 10;   # number of trailing columns used (odd and even combined)
   filter_window_half  = 10;   # half width of median filter (w); full width will be: 2w+1
};

metadata:
{
   hk_glob_pattern = "TEMPO_HK_L0_*.nc";
                     #  filename pattern to identify level 0 telemetry point files

   metadata_template_dir = "$SDPC_ROOT/etc/level1";
};

pixel_quality_flag_params:
{
   hot_thresh = 5;     # hot pixels have values > mean + hot_thresh*stddev
   cold_thresh = 5;    # cold pixels have values < mean - cold_thresh*stddev

   saturation:
   {
      fudge_factor = 0.99;
                     # How close to approach the formal saturation threshold.

      # range, in pixels, at which a saturated pixel affects its neighbors:

      neighbor_hw_serial = 1;      # spatial direction half-width (serial)
      neighbor_hw_parallel = 2;    # spectral direction half-width (parallel)
   };

   transients:
   {
      # In radiance data, pixel to pixel and frame to frame brightness variations
      # cause this algorithm to flag a lot of pixels.
      # For irradiances and darks, the scene is stable and it works better.

      # size of region to examine when identifying transient pixels:

      neighbor_hw_serial = 0;      # spatial direction half-width (serial)
      neighbor_hw_parallel = 2;    # spectral direction half-width (parallel)
      threshold = 1.0;
   };

   # A pixel may be added to the badpix file if that pixel is flagged as
   # bad more than f*N times in a granule that contains >N exposure
   # records, where f=threshold, and N=num_exprecs_needed

   badpix_update:
   {
       threshold = 0.9;
       num_exprecs_needed = 10;
   };

};

sat_config: {

  # sat_lon = geostationary satellite longitude
  # boresight = (lon,lat) coordinates of instrument boresight point:
  # (note: lon=sat_lon and lat=34.095428013683204 => tilt=5.53 deg)

  # for synthetic data (v2)
  #sat_lon = -91.0;
  ##boresight: {lon = -91.0; lat = 33.71;};    # <-- radiance simulation
  #boresight: {lon = -92.7366, lat = 33.722};  # <-- proxy dynamics

  # for synthetic data (v1)
  #sat_lon = -100.0;
  #boresight: {lon = -100.0; lat = 34.095428013683204;};

  # for operations
  sat_lon = -91.0;

  # MRD required boresight point
  #boresight: {lon = -91.6546; lat = 33.71;};
  # Empirically determined flight boresight point:
  boresight: {lon = -89.2170, lat = 33.5231};
};

iers_config: {

# Values of these parameters, accurate for the current date, can be
# obtained from IERS Bulletin A, available from:
# https://www.iers.org/IERS/EN/Publications/Bulletins/bulletins.html
# ut1_utc = predicted UT1-UTC [sec]

  xpole = 0.0;
  ypole = 0.0;
  ut1_utc = 0.494792;
};

novas_config: {
  ephem_name = "$SDPC_OTS_ROOT/share/libnovas/JPLEPH";
};
