% Absolute path to the log file for this daemon:
_P.logfile_name = "/home/houck/sdpc_test/status/L0/$HOST/cachemon_L0_pre_inr.log"$;

% Incoming directory and filename pattern to watch for:
_P.incoming_dir  = "/home/houck/sdpc_test/L0/incoming/ccd";
_P.file_glob     = "*.nc";
_P.newest        = 0;
_P.wait_sec      = 10.0;

% Parameters controlling how the executable is run:
% Note that exec_root_dir is a directory on the current machine;
% use exec_root_dir=NULL if the executable will initiate processing
% on a remote host (e.g. via slurm).
_P.exec_root_dir = NULL;
_P.exec_logfile  = "/home/houck/sdpc_test/status/L0/$HOST/cachemon_L0_pre_inr_exec.log"$;
%
% When the "--rename" option is present
% the exec_subdir parameters are unused
_P.exec_subdir   = NULL;
_P.exec_subdir_is_regex = 0;

% Executable to run:
_P.exec_name     = "${SDPC_ROOT}/bin/run_L0_pre_inr.sh"$;

% Number of parallel tasks associated with executable:
_P.exec_num_parallel = 1;
