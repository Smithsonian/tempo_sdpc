% Absolute path to the log file when daemonized:
_P.logfile_name  = "./log";

% Incoming directory and filename pattern to watch for:
_P.incoming_dir  = "$PWD/incoming"$;
_P.file_glob     = "*.dat";
_P.newest        = 0;
_P.wait_sec      = 0.1;

% Before running executable, create run directory here:
_P.exec_root_dir = "$PWD/out_stage1"$;
_P.exec_logfile  = "/dev/null";
_P.exec_subdir   = "(xxx_\\d{3})_\\d{3}.dat";
_P.exec_subdir_is_regex = 1;

% Executable to run:
_P.exec_name     = "$PWD/stage1.sh"$;

% Number of parallel tasks associated with executable:
_P.exec_num_parallel = 1;
